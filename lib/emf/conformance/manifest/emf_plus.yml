  citation: "MS-EMFPLUS 2.1.1.1"
  status: blocked:model
  reason: "0x4037 appears in MS-EMFPLUS only as a RecordType enumeration entry and a one-line description, with no record layout, so the model decodes it as Records::Unknown and there are no public fields to check; emfplus.record.stroke_fill_path (emf_plus.rb) reports its presence"
