  reason: "a glyph index is valid only against the font's glyph table, which lives in the font file and is not carried by EmfPlusFont; GlyphPos against the glyph array is by-construction one-to-one, since both arrays are sized by GlyphCount (emfplus.draw.driver_string). The RealizedAdvance sentence (GlyphPos holds the first glyph only) contradicts the DataSize formula that counts GlyphCount positions, so no clause is enforced from it"
