  record_types: [EmfPlusSetTSClip]
  citation: "MS-EMFPLUS 2.3.8.1"
  status: blocked:model
  reason: "with C set the rectangles stay raw bytes (SetTSClip#rect_data): the model does not decode the 1-or-2-byte delta scheme, whose first-rectangle reference and two-byte sign rule the text does not give, and which contradicts the 4-bytes-per-rectangle DataSize formula; emfplus.terminal.clip checks only the lower bound both readings imply"
- id: emfplus.stroke_fill_path.fields
