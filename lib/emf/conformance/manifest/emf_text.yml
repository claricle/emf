- id: emf.smalltextout.char_width
  format: emf
  record_types: [EMR_SMALLTEXTOUT]
  citation: "MS-EMF EMR_SMALLTEXTOUT Record"
  status: not_checkable
  reason: "The spec contradicts itself: the cChars bullet says 16-bit characters while TextString says 8- or 16-bit by fuOptions (ETO_SMALL_CHARS), so no single normative width exists; text_string uses the fuOptions width."
- id: emf.smalltextout.bounds_presence
  format: emf
  record_types: [EMR_SMALLTEXTOUT]
  citation: "MS-EMF EMR_SMALLTEXTOUT Record"
  status: not_checkable
  reason: "The spec states no condition under which the optional Bounds rectangle is present beyond ETO_NO_RECT, which text_string already follows to locate TextString."
