- id: emf.exttextout.chars_count
  format: emf
  record_types: [EMR_EXTTEXTOUTA, EMR_EXTTEXTOUTW]
  citation: "MS-EMF 2.2.5"
  status: not_checkable
  reason: "Chars is the only length of OutputString (no terminator or second count exists to compare); what can be checked is that Chars characters lie inside the record, which string_bounds covers."
- id: emf.exttextout.string_encoding_ansi
  format: emf
  record_types: [EMR_EXTTEXTOUTA]
  citation: "MS-EMF 2.2.5"
  status: not_checkable
  reason: "The 8-bit characters are ASCII per the spec but the producer's code page is the selected font charset, which the record does not carry, so no byte value is invalid."
- id: emf.exttextout.bounds_ignored
  format: emf
  record_types: [EMR_EXTTEXTOUTA, EMR_EXTTEXTOUTW]
  citation: "MS-EMF EMR_EXTTEXTOUTA Record"
  status: not_checkable
  reason: "The Bounds rectangle MUST be ignored on receipt, and exScale/eyScale only SHOULD be used when iGraphicsMode is GM_COMPATIBLE, so neither field carries a checkable requirement."
