  - EMR_GLSBOUNDEDRECORD
  citation: MS-EMF 2.3.9
  status: implemented
  reason:
# One diagnostic per defect (W37). A shortfall that a more specific rule also states is left to that rule:
#   EMR_SETCOLORADJUSTMENT           emf.state.fixed_size (decoded), emf.record.fixed_size_raw (Raw)
#   EMR_POLYTEXTOUTA / W             emf.opaque.text_arrays
#   EMR_SETCOLORSPACE, EMR_COLORCORRECTPALETTE   emf.object.fixed_size
#   EMR_SETICMPROFILEA / W, EMR_SETLINKEDUFIS, EMR_COLORMATCHTOTARGETW   emf.state.profile_bounds and
#     emf.state.linked_ufis_bounds when the record decodes; this rule sees only a Raw one
#   EMR_PIXELFORMAT, EMR_FORCEUFIMAPPING   this rule owns a Size below the layout; emf.state.layout_size owns an
#     oversized one
- id: emf.opaque.fixed_size
  format: emf
  record_types:
  - EMR_CREATECOLORSPACE
  - EMR_DELETECOLORSPACE
  - EMR_PIXELFORMAT
  - EMR_FORCEUFIMAPPING
  - EMR_SETICMPROFILEA
  - EMR_SETICMPROFILEW
  - EMR_SETLINKEDUFIS
  - EMR_COLORMATCHTOTARGETW
  - EMR_CREATECOLORSPACEW
  citation: MS-EMF 2.3
  status: implemented
  reason:
# EMR_POLYTEXTOUTA / W are checked by emf.opaque.text_arrays. The ICM profile, linked UFI and color-match records are
# checked here only when Raw; a decoded one gets emf.state.profile_bounds or emf.state.linked_ufis_bounds.
- id: emf.opaque.payload_bounds
  format: emf
  record_types:
  - EMR_SETICMPROFILEA
  - EMR_SETICMPROFILEW
  - EMR_SETLINKEDUFIS
  - EMR_COLORMATCHTOTARGETW
  - EMR_CREATECOLORSPACEW
  citation: MS-EMF 2.3
  status: implemented
  reason:
