- id: emf.state.setmiterlimit.value
  format: emf
  record_types:
  - EMR_SETMITERLIMIT
  citation: MS-EMF 2.3.11.21
  status: not_checkable
  reason: the section types MiterLimit as an unsigned integer while the wire exposes
    a float32; the section states no range, so no clause is checkable
- id: emf.state.pixel_format_flags
  format: emf
  record_types:
  - EMR_PIXELFORMAT
  citation: MS-EMF 2.2.22
  status: deferred
  reason: PFD_DOUBLEBUFFER and PFD_SUPPORT_GDI MUST NOT both be set. dw_flags is exposed and
    readable, but the converted reference text drops the flag bit values (the flag diagram
    labels cannot be mapped to bit positions from the text alone, and no fixture carries
    an EMR_PIXELFORMAT to measure them), so the check waits for the wingdi.h constants
- id: emf.state.icm_profile_flags_encoding
  format: emf
  record_types:
  - EMR_SETICMPROFILEA
  - EMR_SETICMPROFILEW
  citation: MS-EMF 2.3.11.15
  status: not_checkable
  reason: dwFlags values and the ASCII/UTF-16LE content of the name are not constrained
    by the section beyond the cbName+cbData length (checked by emf.state.profile_bounds)
- id: emf.state.color_adjustment_ranges
  format: emf
  record_types:
  - EMR_SETCOLORADJUSTMENT
  citation: MS-EMF 2.2.2
  status: not_checkable
  reason: gamma, contrast, brightness, colorfulness and tint ranges are SHOULD, and
    Values is any combination of the ColorAdjustment enumeration; only Size and IlluminantIndex
    are normative (checked)
- id: emf.state.color_match_delete_transform
  format: emf
  record_types:
  - EMR_COLORMATCHTOTARGETW
  citation: MS-EMF 2.3.11.1
  status: not_checkable
  reason: CS_DELETE_TRANSFORM SHOULD NOT be used before an EMR_SETICMMODE is a SHOULD
    NOT sequence statement
- id: emf.state.scale_fixed_mapping_mode
  format: emf
  record_types:
  - EMR_SCALEVIEWPORTEXTEX
  - EMR_SCALEWINDOWEXTEX
  citation: MS-EMF 2.3.11.7
  status: not_checkable
  reason: the extent MUST NOT change under a fixed-scale mapping mode is playback
    behaviour of the device context, not a property of the record stream
