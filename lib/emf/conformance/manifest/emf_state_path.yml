  citation: MS-EMF 2.3.2.2
  status: not_checkable
  reason: an RgnDataSize larger than the record is reported by emf.record.array_exceeds_size;
    RGN_COPY may omit RgnData (SHOULD); RegionData internals belong to the region
    rules of W11
