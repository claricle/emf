- id: emf.state.invert_rgn_data
  format: emf
  record_types:
  - EMR_INVERTRGN
  citation: MS-EMF 2.3.11.3
  status: not_checkable
  reason: an RgnDataSize larger than the record is recovered by the parser as a Raw
    record and reported by emf.record.array_exceeds_size; RegionData internals belong
    to the region rules of W11
- id: emf.clip.ext_select_clip_rgn_data
