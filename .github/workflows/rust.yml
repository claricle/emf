name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.73.0"
          - os: macos-latest
            toolchain: stable
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/emf-rs/target
    defaults:
      run:
        working-directory: emf-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check

      - name: Check lints
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --workspace --locked

      - name: Run linked C client
        run: sh crates/emf-ffi/tests/run-c-smoke.sh

      - name: Replay stable fuzz corpus
        if: matrix.toolchain == 'stable'
        run: bash fuzz/check-stable.sh

      - name: Set up Ruby for native adapter specs
        if: matrix.toolchain == 'stable'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: .

      - name: Run compiled native Ruby adapter specs
        if: matrix.toolchain == 'stable'
        working-directory: .
        run: |
          case "$RUNNER_OS" in
            Linux) library="$CARGO_TARGET_DIR/debug/libemf_ffi.so" ;;
            macOS) library="$CARGO_TARGET_DIR/debug/libemf_ffi.dylib" ;;
            *) echo "unsupported native adapter host: $RUNNER_OS" >&2; exit 1 ;;
          esac
          test -f "$library"
          EMF_TEST_NATIVE_LIBRARY="$library" bundle exec rspec \
            spec/emf/native spec/emf/native_wmf*_spec.rb spec/emf/wmf

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
