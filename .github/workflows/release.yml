name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc.
          Also, 'skip' to release the current version.rb as-is.
        required: true
        default: 'skip'

# OIDC Trusted Publishing (rubygems.org): no API key needed. The gem's
# Trusted Publisher entry on rubygems.org must declare:
#   owner=claricle, repo=emf, workflow=release.yml, environment=(empty)
permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bump version
        if: github.event.inputs.next_version != 'skip'
        run: |
          gem install gem-release --no-document
          gem bump --version ${{ github.event.inputs.next_version }} --commit --tag --push

      - name: Build gem
        run: gem build emf.gemspec

      - name: Publish to rubygems.org (trusted publishing)
        uses: rubygems/release-gem@v1
